<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Centered Staunton pawn with a tied black ribbon</title>
  <defs>
    <style>
      .night-halo {
        transform-box: fill-box;
        transform-origin: center;
        animation: halo-breathe 5.8s ease-in-out infinite;
      }
      .night-drift {
        transform-box: fill-box;
        transform-origin: center;
        animation: halo-drift 9s ease-in-out infinite alternate;
      }
      .floor-shadow {
        transform-box: fill-box;
        transform-origin: center;
        animation: shadow-breathe 5.8s ease-in-out infinite;
      }
      @keyframes halo-breathe {
        0%, 100% { opacity: .68; transform: scale(.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes halo-drift {
        0% { opacity: .09; transform: translate(-11px, -3px) scale(.9); }
        100% { opacity: .23; transform: translate(13px, 4px) scale(1.08); }
      }
      @keyframes shadow-breathe {
        0%, 100% { opacity: .38; transform: scaleX(.92); }
        50% { opacity: .5; transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .night-halo, .night-drift, .floor-shadow { animation: none; }
      }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <radialGradient id="night" cx="50%" cy="40%" r="78%">
      <stop offset="0" stop-color="#303744"/>
      <stop offset=".5" stop-color="#242831"/>
      <stop offset="1" stop-color="#111318"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#8491a8" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#647086" stop-opacity=".1"/>
      <stop offset="1" stop-color="#4c5669" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="head" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset=".48" stop-color="#eee7dc"/>
      <stop offset=".78" stop-color="#d4cbc0"/>
      <stop offset="1" stop-color="#9e978e"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" x2="1">
      <stop offset="0" stop-color="#b8b0a6"/>
      <stop offset=".2" stop-color="#f8f2e8"/>
      <stop offset=".52" stop-color="#eee7dc"/>
      <stop offset=".78" stop-color="#d0c7bb"/>
      <stop offset="1" stop-color="#918a82"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9ef"/>
      <stop offset=".42" stop-color="#e4dcd0"/>
      <stop offset="1" stop-color="#aba39a"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#night)"/>
  <rect x="12.75" y="12.75" width="230.5" height="230.5" rx="57.25" fill="none" stroke="#3d424d" stroke-width="1.5"/>
  <ellipse class="night-drift" cx="104" cy="94" rx="66" ry="82" fill="url(#halo)"/>
  <ellipse class="night-halo" cx="128" cy="122" rx="84" ry="101" fill="url(#halo)"/>
  <ellipse class="floor-shadow" cx="128" cy="224" rx="79" ry="10" fill="#05070a" opacity=".46"/>
  <g filter="url(#shadow)">
    <circle cx="128" cy="66" r="28" fill="url(#head)"/>
    <ellipse cx="118" cy="55" rx="7" ry="10" fill="#fff" opacity=".24"/>
    <path d="M92 103c0-11 16-20 36-20s36 9 36 20c0 6-4 11-11 15h-50c-7-4-11-9-11-15Z" fill="url(#ivory)"/>
    <path d="M106 112h44c-1 24 7 46 23 65H83c16-19 24-41 23-65Z" fill="url(#ivory)"/>
    <path d="M88 171h80c11 0 19 8 19 18H69c0-10 8-18 19-18Z" fill="url(#ivory)"/>
    <rect x="57" y="185" width="142" height="20" rx="10" fill="url(#base)"/>
    <rect x="45" y="201" width="166" height="25" rx="12.5" fill="url(#base)"/>
    <path d="M76 189h104" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".28"/>
    <path d="M59 205h138" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".2"/>
  </g>
  <path d="M92 56c23-6 49-6 72 0v23c-23 6-49 6-72 0Z" fill="#050403"/>
  <path d="m163 58 14-8 12 9-14 12Z" fill="#050403"/>
  <path d="m175 68 24 5-14 18-16-13Z" fill="#050403"/>
  <path d="m176 70 19 17-7 12-23-21Z" fill="#050403"/>
</svg>
